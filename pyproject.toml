[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-data-engineering-practice-suite"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "pandas>=2.2", "pyarrow>=16", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["labs"]
addopts = ["--import-mode=importlib"]
